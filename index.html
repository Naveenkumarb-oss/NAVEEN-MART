<script>

"use strict";

/* =========================================================
   EXCEPTIONS
========================================================= */

class AuthenticationException extends Error {
    constructor(message) {
        super(message);
        this.name = "AuthenticationException";
    }
}

class StockDepletedException extends Error {
    constructor(message) {
        super(message);
        this.name = "StockDepletedException";
    }
}

class UnauthorizedAccessException extends Error {
    constructor(message) {
        super(message);
        this.name = "UnauthorizedAccessException";
    }
}

class ValidationException extends Error {
    constructor(message) {
        super(message);
        this.name = "ValidationException";
    }
}


/* =========================================================
   MODELS
========================================================= */

class User {

    constructor(id, name, email, password, role) {
        this.id = id;
        this.name = name;
        this.email = email;
        this.password = password;
        this.role = role;
    }
}

class Product {

    constructor(id, name, sellerId, price, stock) {
        this.id = id;
        this.name = name;
        this.sellerId = sellerId;
        this.price = Number(price);
        this.stock = Number(stock);
    }
}

class Order {

    constructor(id, buyerId, productId, qty, total, status = "Pending") {
        this.id = id;
        this.buyerId = buyerId;
        this.productId = productId;
        this.qty = Number(qty);
        this.total = Number(total);
        this.status = status;
    }
}


/* =========================================================
   REPOSITORY
========================================================= */

class DataRepository {

    constructor() {

        this.userMap = new Map();
        this.productMap = new Map();
        this.orderMap = new Map();

        this.bootstrapDatabase();
    }

    bootstrapDatabase() {

        const xml = document.getElementById("xml-datastore").textContent;

        const parser = new DOMParser();

        const doc = parser.parseFromString(xml, "text/xml");

        /* USERS */

        doc.querySelectorAll("user").forEach(node => {

            const user = new User(
                node.querySelector("id").textContent,
                node.querySelector("name").textContent,
                node.querySelector("email").textContent,
                node.querySelector("password").textContent,
                node.querySelector("role").textContent
            );

            this.userMap.set(user.id, user);
        });


        /* PRODUCTS */

        doc.querySelectorAll("product").forEach(node => {

            const product = new Product(
                node.querySelector("id").textContent,
                node.querySelector("name").textContent,
                node.querySelector("sellerId").textContent,
                node.querySelector("price").textContent,
                node.querySelector("stock").textContent
            );

            this.productMap.set(product.id, product);
        });


        /* ORDERS */

        doc.querySelectorAll("order").forEach(node => {

            const order = new Order(
                node.querySelector("id").textContent,
                node.querySelector("buyerId").textContent,
                node.querySelector("productId").textContent,
                node.querySelector("qty").textContent,
                node.querySelector("total").textContent,
                node.querySelector("status").textContent
            );

            this.orderMap.set(order.id, order);
        });
    }

    getUsers() {
        return Array.from(this.userMap.values());
    }

    getProducts() {
        return Array.from(this.productMap.values());
    }

    getOrders() {
        return Array.from(this.orderMap.values());
    }

    getUser(id) {
        return this.userMap.get(id);
    }

    getProduct(id) {
        return this.productMap.get(id);
    }

    getOrder(id) {
        return this.orderMap.get(id);
    }

    saveUser(user) {
        this.userMap.set(user.id, user);
    }

    saveProduct(product) {
        this.productMap.set(product.id, product);
    }

    deleteProduct(id) {
        this.productMap.delete(id);
    }

    saveOrder(order) {
        this.orderMap.set(order.id, order);
    }
}


const DB = new DataRepository();


/* =========================================================
   AUTHENTICATION SERVICE
========================================================= */

class AuthService {

    constructor() {
        this.session = null;
    }

    login(email, password) {

        const user = DB.getUsers().find(
            u => u.email.toLowerCase() === email.toLowerCase()
                && u.password === password
        );

        if (!user) {
            throw new AuthenticationException(
                "Invalid email or password."
            );
        }

        this.session = user;

        localStorage.setItem(
            "naveenmart_session",
            user.id
        );

        return user;
    }

    register(name, email, password, role) {

        if (!name || !email || !password || !role) {
            throw new ValidationException(
                "All registration fields are required."
            );
        }

        if (DB.getUsers().some(
            u => u.email.toLowerCase() === email.toLowerCase()
        )) {
            throw new ValidationException(
                "Email address already exists."
            );
        }

        const id =
            "USR-" +
            Math.floor(100 + Math.random() * 899);

        const user = new User(
            id,
            name,
            email,
            password,
            role
        );

        DB.saveUser(user);

        return user;
    }

    logout() {

        this.session = null;

        localStorage.removeItem(
            "naveenmart_session"
        );

        renderLogin();
    }

    restoreSession() {

        const id =
            localStorage.getItem(
                "naveenmart_session"
            );

        if (id) {

            const user = DB.getUser(id);

            if (user) {
                this.session = user;
                return user;
            }
        }

        return null;
    }

    isLoggedIn() {
        return this.session !== null;
    }
}


const AUTH = new AuthService();


/* =========================================================
   AUTHORIZATION
========================================================= */

function requireLogin() {

    if (!AUTH.isLoggedIn()) {
        throw new UnauthorizedAccessException(
            "Please login first."
        );
    }
}


function requireRole(role) {

    requireLogin();

    if (AUTH.session.role !== role) {

        throw new UnauthorizedAccessException(
            "You do not have permission to perform this operation."
        );
    }
}


/* =========================================================
   PRODUCT SERVICE
========================================================= */

class ProductService {

    getAllProducts() {
        return DB.getProducts();
    }

    getSellerProducts() {

        requireRole("Seller");

        return DB.getProducts().filter(
            p => p.sellerId === AUTH.session.id
        );
    }

    addProduct(name, price, stock) {

        requireRole("Seller");

        if (!name || price <= 0 || stock < 0) {
            throw new ValidationException(
                "Invalid product information."
            );
        }

        const id =
            "PROD-" +
            Math.floor(100 + Math.random() * 899);

        const product = new Product(
            id,
            name,
            AUTH.session.id,
            price,
            stock
        );

        DB.saveProduct(product);

        return product;
    }

    updateProduct(id, name, price, stock) {

        requireRole("Seller");

        const product = DB.getProduct(id);

        if (!product) {
            throw new ValidationException(
                "Product not found."
            );
        }

        if (product.sellerId !== AUTH.session.id) {
            throw new UnauthorizedAccessException(
                "You cannot modify another seller's product."
            );
        }

        product.name = name;
        product.price = Number(price);
        product.stock = Number(stock);

        DB.saveProduct(product);
    }

    deleteProduct(id) {

        requireRole("Seller");

        const product = DB.getProduct(id);

        if (!product) return;

        if (product.sellerId !== AUTH.session.id) {
            throw new UnauthorizedAccessException(
                "Unauthorized product deletion."
            );
        }

        DB.deleteProduct(id);
    }
}


const PRODUCT_SERVICE = new ProductService();


/* =========================================================
   ORDER SERVICE
========================================================= */

class OrderService {

    createOrder(productId, qty) {

        requireRole("Buyer");

        qty = Number(qty);

        if (qty <= 0) {
            throw new ValidationException(
                "Quantity must be greater than zero."
            );
        }

        const product =
            DB.getProduct(productId);

        if (!product) {
            throw new ValidationException(
                "Product does not exist."
            );
        }

        if (product.stock < qty) {
            throw new StockDepletedException(
                `Only ${product.stock} units are available.`
            );
        }

        const total =
            product.price * qty;

        product.stock -= qty;

        DB.saveProduct(product);

        const orderId =
            "ORD-" +
            Math.floor(1000 + Math.random() * 8999);

        const order = new Order(
            orderId,
            AUTH.session.id,
            productId,
            qty,
            total,
            "Pending"
        );

        DB.saveOrder(order);

        return order;
    }

    updateStatus(orderId, status) {

        requireRole("Admin");

        const order =
            DB.getOrder(orderId);

        if (!order) {
            throw new ValidationException(
                "Order not found."
            );
        }

        order.status = status;

        DB.saveOrder(order);
    }

    getBuyerOrders() {

        requireRole("Buyer");

        return DB.getOrders().filter(
            o => o.buyerId === AUTH.session.id
        );
    }
}


const ORDER_SERVICE = new OrderService();


/* =========================================================

========================================================= */

function money(value) {

    return new Intl.NumberFormat(
        "en-IN",
        {
            style: "currency",
            currency: "INR"
        }
    ).format(value);
}


function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function showError(message) {

    alert(message);
}


function card(title, value, color = "indigo") {

    return `
        <div class="bg-slate-800/70 border border-slate-700
                    rounded-2xl p-5 shadow-xl">

            <p class="text-sm text-slate-400">
                ${title}
            </p>

            <p class="text-3xl font-bold mt-2 text-${color}-400">
                ${value}
            </p>

        </div>
    `;
}

function handleLogin(event) {

    event.preventDefault();

    try {

        const email =
            document.getElementById(
                "login-email"
            ).value;

        const password =
            document.getElementById(
                "login-password"
            ).value;

        AUTH.login(email, password);

        renderDashboard();

    } catch (error) {

        showError(error.message);
    }
}


/* =========================================================
   DASHBOARD ROUTER
========================================================= */

function renderDashboard() {

    renderNavigation();

    if (!AUTH.session) {

        renderLogin();

        return;
    }

    if (AUTH.session.role === "Admin") {
        renderAdminDashboard();
    }

    else if (AUTH.session.role === "Seller") {
        renderSellerDashboard();
    }

    else if (AUTH.session.role === "Buyer") {
        renderBuyerDashboard();
    }
}

                        SELLER WORKSPACE
                    </p>

                    <h1 class="text-3xl font-black mt-1">
                        Inventory Management
                    </h1>

                </div>

                <button
                    onclick="openAddProductModal()"
                    class="bg-emerald-600
                           hover:bg-emerald-500
                           px-5 py-3 rounded-xl
                           font-bold">
                    + Add Product
                </button>

            </div>


            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                ${card(
                    "My Products",
                    products.length,
                    "emerald"
                )}

                ${card(
                    "Seller Orders",
                    orders.length,
                    "amber"
                )}

                ${card(
                    "Sales Revenue",
                    money(revenue),
                    "cyan"
                )}

            </div>


            <section class="bg-slate-800/60
                            border border-slate-700
                            rounded-2xl overflow-hidden">

                <div class="p-5 border-b border-slate-700">

                    <h2 class="font-bold text-lg">
                        Product Inventory
                    </h2>

                </div>


                <div class="grid grid-cols-1 md:grid-cols-2
                            lg:grid-cols-3 gap-5 p-5">

                    ${products.map(product => `

                        <div class="bg-slate-900
                                    border border-slate-700
                                    rounded-xl p-5">

                            <div class="flex justify-between">

                                <span class="text-xs
                                             font-mono
                                             text-indigo-400">
                                    ${product.id}
                                </span>

                                <span class="text-xs
                                             ${product.stock <= 5
                                                ? "text-red-400"
                                                : "text-emerald-400"}">
                                    ${product.stock} in stock
                                </span>

                            </div>

                            <h3 class="font-bold text-lg mt-4">
                                ${escapeHTML(product.name)}
                            </h3>

                            <p class="text-2xl font-black
                                      text-emerald-400 mt-3">
                                ${money(product.price)}
                            </p>

                            <div class="flex gap-2 mt-5">

                                <button
                                    onclick="openEditProductModal(
                                        '${product.id}'
                                    )"
                                    class="flex-1
                                           bg-slate-700
                                           hover:bg-slate-600
                                           py-2 rounded-lg">
                                    Edit
                                </button>

                                <button
                                    onclick="removeProduct(
                                        '${product.id}'
                                    )"
                                    class="bg-red-600
                                           hover:bg-red-500
                                           px-4 rounded-lg">
                                    Delete
                                </button>

                            </div>

                        </div>

                    `).join("")}

                </div>

            </section>

        </div>
    `;
}


/* =========================================================
   PRODUCT MODALS
========================================================= */

function openAddProductModal() {

    portal.insertAdjacentHTML(
        "beforeend",
        `

        <div id="product-modal"
             class="fixed inset-0 z-[100]
                    bg-black/70 flex items-center
                    justify-center p-4">

            <div class="bg-slate-800
                        border border-slate-700
                        rounded-2xl
                        w-full max-w-md p-6">

                <div class="flex justify-between mb-5">

                    <h2 class="text-xl font-bold">
                        Add Product
                    </h2>

                    <button
                        onclick="closeModal()"
                        class="text-slate-400">
                        ✕
                    </button>

                </div>

                <form onsubmit="addProduct(event)"
                      class="space-y-4">

                    <input
                        id="product-name"
                        required
                        placeholder="Product name"
                        class="w-full bg-slate-900
                               border border-slate-700
                               rounded-lg p-3">

                    <input
                        id="product-price"
                        required
                        type="number"
                        min="0"
                        step="0.01"
                        placeholder="Price"
                        class="w-full bg-slate-900
                               border border-slate-700
                               rounded-lg p-3">

                    <input
                        id="product-stock"
                        required
                        type="number"
                        min="0"
                        placeholder="Stock"
                        class="w-full bg-slate-900
                               border border-slate-700
                               rounded-lg p-3">

                    <button
                        class="w-full bg-emerald-600
                               hover:bg-emerald-500
                               py-3 rounded-lg font-bold">
                        Save Product
                    </button>

                </form>

            </div>

        </div>
        `
    );
}


function openEditProductModal(id) {

    const product =
        DB.getProduct(id);

    if (!product) return;

    portal.insertAdjacentHTML(
        "beforeend",
        `

        <div id="product-modal"
             class="fixed inset-0 z-[100]
                    bg-black/70 flex items-center
                    justify-center p-4">

            <div class="bg-slate-800
                        border border-slate-700
                        rounded-2xl
                        w-full max-w-md p-6">

                <h2 class="text-xl font-bold mb-5">
                    Edit Product
                </h2>

                <form onsubmit="editProduct(
                                    event,
                                    '${product.id}'
                                )"
                      class="space-y-4">

                    <input
                        id="edit-name"
                        required
                        value="${escapeHTML(product.name)}"
                        class="w-full bg-slate-900
                               border border-slate-700
                               rounded-lg p-3">

                    <input
                        id="edit-price"
                        required
                        type="number"
                        step="0.01"
                        min="0"
                        value="${product.price}"
                        class="w-full bg-slate-900
                               border border-slate-700
                               rounded-lg p-3">

                    <input
                        id="edit-stock"
                        required
                        type="number"
                        min="0"
                        value="${product.stock}"
                        class="w-full bg-slate-900
                               border border-slate-700
                               rounded-lg p-3">

                    <div class="flex gap-2">

                        <button
                            type="button"
                            onclick="closeModal()"
                            class="flex-1 bg-slate-700
                                   py-3 rounded-lg">
                            Cancel
                        </button>

                        <button
                            class="flex-1 bg-indigo-600
                                   py-3 rounded-lg font-bold">
                            Update
                        </button>

                    </div>

                </form>

            </div>

        </div>
        `
    );
}


function closeModal() {

    const modal =
        document.getElementById(
            "product-modal"
        );

    if (modal) modal.remove();
}


function addProduct(event) {

    event.preventDefault();

    try {

        PRODUCT_SERVICE.addProduct(
            document.getElementById(
                "product-name"
            ).value,

            Number(
                document.getElementById(
                    "product-price"
                ).value
            ),

            Number(
                document.getElementById(
                    "product-stock"
                ).value
            )
        );

        closeModal();

        renderSellerDashboard();

    } catch (error) {

        showError(error.message);
    }
}


function editProduct(event, id) {

    event.preventDefault();

    try {

        PRODUCT_SERVICE.updateProduct(

            id,

            document.getElementById(
                "edit-name"
            ).value,

            Number(
                document.getElementById(
                    "edit-price"
                ).value
            ),

            Number(
                document.getElementById(
                    "edit-stock"
                ).value
            )
        );

        closeModal();

        renderSellerDashboard();

    } catch (error) {

        showError(error.message);
    }
}


function removeProduct(id) {

    if (!confirm(
        "Delete this product?"
    )) {
        return;
    }

    try {

        PRODUCT_SERVICE.deleteProduct(id);

        renderSellerDashboard();

    } catch (error) {

        showError(error.message);
    }
}


/* =========================================================
   BUYER DASHBOARD
========================================================= */

function renderBuyerDashboard() {

    const products =
        PRODUCT_SERVICE.getAllProducts();

    const orders =
        ORDER_SERVICE.getBuyerOrders();

    portal.innerHTML = `

        <div class="space-y-8">

            <div>

                <p class="text-cyan-400 text-sm font-semibold">
                    BUYER MARKETPLACE
                </p>

                <h1 class="text-3xl font-black mt-1">
                    Welcome to NaveenMart
                </h1>

                <p class="text-slate-400 mt-2">
                    Browse products and manage your orders.
                </p>

            </div>


            <!-- PRODUCT SEARCH -->

            <div class="bg-slate-800
                        border border-slate-700
                        rounded-xl p-4">

                <input
                    id="product-search"
                    oninput="filterProducts()"
                    placeholder="Search products..."
                    class="w-full bg-slate-900
                           border border-slate-700
                           rounded-lg px-4 py-3">

            </div>


            <div id="buyer-products"
                 class="grid grid-cols-1
                        md:grid-cols-2
                        lg:grid-cols-3 gap-5">

                ${products.map(renderBuyerProduct).join("")}

            </div>


            <!-- ORDERS -->

            <section class="bg-slate-800/60
                            border border-slate-700
                            rounded-2xl overflow-hidden">

                <div class="p-5 border-b border-slate-700">

                    <h2 class="font-bold text-lg">
                        My Orders
                    </h2>

                </div>

                ${
                    orders.length === 0

                    ?

                    `
                    <div class="p-8 text-center
                                text-slate-500">
                        No orders yet.
                    </div>
                    `

                    :

                    `
                    <div class="overflow-x-auto">

                        <table class="w-full text-sm">

                            <thead class="bg-slate-900">

                                <tr>
                                    <th class="p-4 text-left">
                                        Order
                                    </th>

                                    <th class="p-4 text-left">
                                        Product
                                    </th>

                                    <th class="p-4 text-left">
                                        Quantity
                                    </th>

                                    <th class="p-4 text-left">
                                        Total
                                    </th>

                                    <th class="p-4 text-left">
                                        Status
                                    </th>
                                </tr>

                            </thead>

                            <tbody>

                                ${orders.map(order => {

                                    const product =
                                        DB.getProduct(
                                            order.productId
                                        );

                                    return `

                                    <tr class="border-t border-slate-700">

                                        <td class="p-4 font-mono
                                                   text-indigo-400">
                                            ${order.id}
                                        </td>

                                        <td class="p-4">
                                            ${escapeHTML(
                                                product?.name || "Unknown"
                                            )}
                                        </td>

                                        <td class="p-4">
                                            ${order.qty}
                                        </td>

                                        <td class="p-4 font-bold">
                                            ${money(order.total)}
                                        </td>

                                        <td class="p-4">
                                            <span class="
                                                ${order.status === "Delivered"
                                                    ? "text-emerald-400"
                                                    : "text-amber-400"}
                                            ">
                                                ${order.status}
                                            </span>
                                        </td>

                                    </tr>

                                    `;

                                }).join("")}

                            </tbody>

                        </table>

                    </div>
                    `
                }

            </section>

        </div>
    `;
}


function renderBuyerProduct(product) {

    return `

        <div class="buyer-product
                    bg-slate-800
                    border border-slate-700
                    rounded-2xl p-5
                    hover:border-indigo-500/50
                    transition"
             data-name="${escapeHTML(
                 product.name.toLowerCase()
             )}">

            <div class="h-32
                        rounded-xl
                        bg-gradient-to-br
                        from-indigo-600/20
                        to-cyan-600/20
                        flex items-center
                        justify-center">

                <div class="text-4xl">
                    🖥️
                </div>

            </div>


            <div class="mt-5">

                <p class="text-xs text-slate-500 font-mono">
                    ${product.id}
                </p>

                <h3 class="font-bold text-lg mt-1">
                    ${escapeHTML(product.name)}
                </h3>

                <div class="flex items-center
                            justify-between mt-4">

                    <span class="text-2xl
                                 font-black
                                 text-indigo-400">
                        ${money(product.price)}
                    </span>

                    <span class="text-xs
                                 ${
                                    product.stock > 0
                                    ? "text-emerald-400"
                                    : "text-red-400"
                                 }">
                        ${
                            product.stock > 0
                            ? `${product.stock} available`
                            : "Out of stock"
                        }
                    </span>

                </div>


                <div class="flex gap-2 mt-5">

                    <input
                        id="qty-${product.id}"
                        type="number"
                        min="1"
                        max="${product.stock}"
                        value="1"
                        ${product.stock === 0
                            ? "disabled"
                            : ""}
                        class="w-20 bg-slate-900
                               border border-slate-700
                               rounded-lg px-3">

                    <button
                        onclick="buyProduct(
                            '${product.id}'
                        )"
                        ${product.stock === 0
                            ? "disabled"
                            : ""}
                        class="flex-1
                               bg-indigo-600
                               hover:bg-indigo-500
                               disabled:bg-slate-700
                               py-2 rounded-lg
                               font-bold">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>
    `;
}


function filterProducts() {

    const query =
        document.getElementById(
            "product-search"
        ).value.toLowerCase();

    document
        .querySelectorAll(".buyer-product")
        .forEach(card => {

            const name =
                card.dataset.name;

            card.style.display =
                name.includes(query)
                ? ""
                : "none";
        });
}


function buyProduct(id) {

    try {

        const qty =
            Number(
                document.getElementById(
                    `qty-${id}`
                ).value
            );

        const order =
            ORDER_SERVICE.createOrder(
                id,
                qty
            );

        alert(
            `Order ${order.id} created successfully!`
        );

        renderBuyerDashboard();

    } catch (error) {

        showError(error.message);
    }
}


/* =========================================================
   APPLICATION STARTUP
========================================================= */

function initializeApplication() {

    const session =
        AUTH.restoreSession();

    if (session) {

        renderDashboard();

    } else {

        renderLogin();
    }
}


initializeApplication();

</script>

</body>
</html>
